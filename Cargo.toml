[workspace]
members = [
    "crates/core",
    "crates/database",
    "crates/scanner",
    "crates/intelligence",
    "crates/mcp",
    "crates/cli",
    "apps/desktop/src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Looma Team"]
license = "MIT"

[workspace.dependencies]
# Internal crates
looma-core = { path = "crates/core" }
looma-database = { path = "crates/database" }
looma-scanner = { path = "crates/scanner" }
looma-intelligence = { path = "crates/intelligence" }
looma-mcp = { path = "crates/mcp" }

# CLI & Arguments
clap = { version = "4.5", features = ["derive"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling & logging
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Data & Database
rusqlite = { version = "0.33", features = ["bundled", "bundled-full", "chrono", "serde_json"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
parking_lot = "0.12"
directories = "6.0"
walkdir = "2.5"
sha2 = "0.10"
hex = "0.4"
rfd = "0.15"
base64 = "0.22"
